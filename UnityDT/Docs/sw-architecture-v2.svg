  <circle cx="1226" cy="451" r="11" fill="none" stroke="#000000" stroke-width="2"/>
  <rect x="1212" y="424" width="18" height="8" rx="2" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="1345" y="447" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">Intel D435</text>
  <text x="1345" y="466" font-size="10" fill="#333333" text-anchor="middle">기판 · 부품 촬영</text>

  <!-- ============ job_manager ============ -->
  <rect x="45" y="390" width="1085" height="105" rx="6" fill="#ffe6cc" stroke="#000000" stroke-width="2"/>
  <text x="62" y="418" font-size="16" font-weight="700" fill="#000000">job_manager (ROS2)</text>
  <text x="255" y="418" font-size="11" fill="#333333">Level 2 · 셀 제어 — 공정을 소유하는 유일한 주체</text>

  <rect x="340" y="432" width="185" height="42" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="432" y="458" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">공정 상태기계</text>
  <rect x="540" y="432" width="185" height="42" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="632" y="458" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">레시피 · 시퀀싱</text>
  <rect x="740" y="432" width="185" height="42" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="832" y="458" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">정지 · 안전 인터록</text>
  <rect x="940" y="432" width="175" height="42" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="1027" y="458" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">이벤트 보고</text>

  <!-- ============ FR5 Control ============ -->
  <rect x="45" y="545" width="380" height="270" rx="6" fill="#fff2cc" stroke="#000000" stroke-width="2"/>
  <text x="62" y="575" font-size="16" font-weight="700" fill="#000000">FR5 Control</text>
  <!-- robot arm icon -->
  <rect x="66" y="742" width="56" height="12" rx="2" fill="none" stroke="#000000" stroke-width="2"/>
  <line x1="94" y1="742" x2="94" y2="688" stroke="#000000" stroke-width="2.5"/>
  <line x1="94" y1="688" x2="136" y2="654" stroke="#000000" stroke-width="2.5"/>
  <line x1="136" y1="654" x2="136" y2="628" stroke="#000000" stroke-width="2.5"/>
  <circle cx="94" cy="688" r="5" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="136" cy="654" r="5" fill="none" stroke="#000000" stroke-width="2"/>
  <line x1="127" y1="622" x2="145" y2="622" stroke="#000000" stroke-width="2.5"/>

  <rect x="185" y="595" width="215" height="42" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="292" y="621" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">Motion Planning</text>
  <rect x="185" y="655" width="215" height="42" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="292" y="681" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">Pick &amp; Place</text>
  <rect x="185" y="715" width="215" height="42" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="292" y="741" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">Gripper</text>
  <line x1="292" y1="637" x2="292" y2="653" stroke="#000000" stroke-width="1.8" marker-end="url(#s)"/>
  <line x1="292" y1="697" x2="292" y2="713" stroke="#000000" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="292" y="785" font-size="10" fill="#333333" text-anchor="middle">순서 의존 — 계획이 준비돼야 Pick &amp; Place</text>

  <!-- ============ Conveyor control ============ -->
  <rect x="470" y="545" width="340" height="270" rx="6" fill="#ffcce6" stroke="#999999" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="487" y="575" font-size="16" font-weight="700" fill="#555555">Conveyor control</text>
  <!-- conveyor icon -->
  <rect x="492" y="690" width="86" height="16" rx="3" fill="none" stroke="#777777" stroke-width="2"/>
  <circle cx="506" cy="716" r="10" fill="none" stroke="#777777" stroke-width="2"/>
  <circle cx="535" cy="716" r="10" fill="none" stroke="#777777" stroke-width="2"/>
  <circle cx="564" cy="716" r="10" fill="none" stroke="#777777" stroke-width="2"/>
  <line x1="496" y1="732" x2="574" y2="732" stroke="#777777" stroke-width="2"/>

  <rect x="600" y="605" width="190" height="42" rx="4" fill="#ffffff" stroke="#999999" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="695" y="631" font-size="12" font-weight="600" fill="#666666" text-anchor="middle">Start / Stop</text>
  <rect x="600" y="665" width="190" height="42" rx="4" fill="#ffffff" stroke="#999999" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="695" y="691" font-size="12" font-weight="600" fill="#666666" text-anchor="middle">Position Control</text>
  <text x="640" y="762" font-size="10" fill="#8b1a1a" text-anchor="middle">현재 Unity 내부(ConveyMock) — ROS2로 이관 필요</text>

  <!-- ============ Vision / AI Server ============ -->
  <rect x="855" y="545" width="585" height="270" rx="6" fill="#b0e3e6" stroke="#000000" stroke-width="2"/>
  <text x="872" y="575" font-size="16" font-weight="700" fill="#000000">Vision/AI Server</text>
  <!-- AI chip icon -->
  <rect x="882" y="655" width="60" height="60" rx="4" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="912" y="693" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">AI</text>
  <line x1="895" y1="655" x2="895" y2="643" stroke="#000000" stroke-width="2"/>
  <line x1="912" y1="655" x2="912" y2="643" stroke="#000000" stroke-width="2"/>
  <line x1="929" y1="655" x2="929" y2="643" stroke="#000000" stroke-width="2"/>
  <line x1="895" y1="715" x2="895" y2="727" stroke="#000000" stroke-width="2"/>
  <line x1="912" y1="715" x2="912" y2="727" stroke="#000000" stroke-width="2"/>
  <line x1="929" y1="715" x2="929" y2="727" stroke="#000000" stroke-width="2"/>
  <line x1="882" y1="668" x2="870" y2="668" stroke="#000000" stroke-width="2"/>
  <line x1="882" y1="685" x2="870" y2="685" stroke="#000000" stroke-width="2"/>
  <line x1="882" y1="702" x2="870" y2="702" stroke="#000000" stroke-width="2"/>
  <line x1="942" y1="668" x2="954" y2="668" stroke="#000000" stroke-width="2"/>
  <line x1="942" y1="685" x2="954" y2="685" stroke="#000000" stroke-width="2"/>
  <line x1="942" y1="702" x2="954" y2="702" stroke="#000000" stroke-width="2"/>

  <rect x="990" y="605" width="205" height="42" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="1092" y="631" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">PCB Alignment</text>
  <rect x="1215" y="605" width="205" height="42" rx="4" fill="#ffffff" stroke="#999999" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="1317" y="631" font-size="12" font-weight="600" fill="#666666" text-anchor="middle">Defect Inspection</text>
  <rect x="990" y="665" width="205" height="42" rx="4" fill="#ffffff" stroke="#999999" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="1092" y="691" font-size="12" font-weight="600" fill="#666666" text-anchor="middle">Precision Placement</text>
  <rect x="1215" y="665" width="205" height="42" rx="4" fill="#ffffff" stroke="#999999" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="1317" y="691" font-size="12" font-weight="600" fill="#666666" text-anchor="middle">Factory Monitoring</text>
  <text x="1205" y="762" font-size="10" fill="#333333" text-anchor="middle">검출 결과는 job_manager 로, HUD 영상은 GUI/DT 로 간다</text>

  <!-- ================= ARROWS ================= -->

  <!-- GUI/DT -> Main Server : HTTP -->
  <line x1="367" y1="175" x2="436" y2="175" stroke="#00a352" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="401" y="163" font-size="10" font-weight="700" fill="#00723a" text-anchor="middle">HTTP</text>
  <text x="401" y="194" font-size="10" fill="#00723a" text-anchor="middle">작업 지시</text>

  <!-- Main Server <-> Database : SQL -->
  <line x1="762" y1="175" x2="831" y2="175" stroke="#4d4d4d" stroke-width="2.5" marker-start="url(#s)" marker-end="url(#s)"/>
  <text x="796" y="163" font-size="10" font-weight="700" fill="#333333" text-anchor="middle">SQL</text>
  <text x="796" y="194" font-size="10" fill="#333333" text-anchor="middle">read / write</text>

  <!-- Main Server -> job_manager : 지시 -->
  <line x1="560" y1="305" x2="560" y2="386" stroke="#1a73e8" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="572" y="342" font-size="10" font-weight="700" fill="#1558b0">지시 ↓ 검증된 작업</text>

  <!-- job_manager -> Main Server : 보고 -->
  <line x1="700" y1="386" x2="700" y2="305" stroke="#1a73e8" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="712" y="342" font-size="10" font-weight="700" fill="#1558b0">보고 ↑ 실행 · 검사 결과</text>

  <!-- job_manager -> GUI/DT : 텔레메트리 -->
  <line x1="120" y1="386" x2="120" y2="305" stroke="#1a73e8" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="132" y="336" font-size="10" font-weight="700" fill="#1558b0">텔레메트리 ↑</text>
  <text x="132" y="352" font-size="8.5" fill="#1558b0">joint_states · vision · feedback</text>
  <text x="132" y="366" font-size="8.5" fill="#1558b0">via /UnityEndpoint</text>

  <!-- GUI/DT -> job_manager : 수동 · 정지 -->
  <line x1="300" y1="305" x2="300" y2="386" stroke="#cc0000" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="312" y="336" font-size="10" font-weight="700" fill="#a30000">수동 조작 · 정지 ↓</text>
  <text x="312" y="352" font-size="8.5" fill="#a30000">안전 경로 — 상위 경유 없음</text>

  <!-- job_manager <-> FR5 -->
  <line x1="235" y1="497" x2="235" y2="543" stroke="#1a73e8" stroke-width="2.5" marker-start="url(#b)" marker-end="url(#b)"/>
  <text x="247" y="524" font-size="9.5" fill="#1558b0">movej · 그리퍼 / 상태</text>

  <!-- job_manager <-> Conveyor -->
  <line x1="640" y1="497" x2="640" y2="543" stroke="#1a73e8" stroke-width="2.5" marker-start="url(#b)" marker-end="url(#b)"/>
  <text x="652" y="524" font-size="9.5" fill="#1558b0">구동 · 정지 / 위치</text>

  <!-- job_manager <-> Vision -->
  <line x1="990" y1="497" x2="990" y2="543" stroke="#1a73e8" stroke-width="2.5" marker-start="url(#b)" marker-end="url(#b)"/>
  <text x="1002" y="524" font-size="9.5" fill="#1558b0">촬영 요청 / 검출 결과</text>

  <!-- 외부 카메라 -> Vision -->
  <line x1="1310" y1="497" x2="1310" y2="543" stroke="#1a73e8" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="1322" y="524" font-size="9.5" fill="#1558b0">영상 스트림</text>

  <!-- footer -->
  <text x="45" y="860" font-size="10.5" fill="#555555">지시는 내려가고 보고는 올라온다 · Unity는 요청과 표시만 한다 · 컨베이어와 로봇은 job_manager 한 주체가 지휘한다 · 비상정지는 별도 하드와이어드 회로를 둔다</text>

</svg>
