<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="890" viewBox="0 0 1480 890" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">

  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#dcdcdc"/>
    </pattern>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00a352"/>
    </marker>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4d4d4d"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cc0000"/>
    </marker>
  </defs>

  <rect width="1480" height="890" fill="#ffffff"/>
  <rect width="1480" height="890" fill="url(#dots)"/>

  <!-- ============ GUI/DT ============ -->
  <rect x="45" y="48" width="320" height="255" rx="6" fill="#f8cecc" stroke="#000000" stroke-width="2"/>
  <text x="62" y="78" font-size="16" font-weight="700" fill="#000000">GUI/DT</text>
  <!-- monitor icon -->
  <rect x="66" y="128" width="66" height="46" rx="3" fill="none" stroke="#000000" stroke-width="2"/>
  <rect x="76" y="138" width="46" height="26" rx="2" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="99" y1="174" x2="99" y2="186" stroke="#000000" stroke-width="2"/>
  <line x1="80" y1="186" x2="118" y2="186" stroke="#000000" stroke-width="2"/>
  <text x="99" y="206" font-size="9" fill="#333333" text-anchor="middle">Unity</text>

  <rect x="155" y="95" width="195" height="40" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="252" y="120" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">Start / Stop 요청</text>
  <rect x="155" y="152" width="195" height="40" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="252" y="177" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">Monitoring</text>
  <rect x="155" y="209" width="195" height="40" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="252" y="234" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">3D Visualization</text>
  <text x="252" y="272" font-size="10" fill="#8b1a1a" text-anchor="middle">요청만 한다 · 공정을 소유하지 않는다</text>

  <!-- ============ Main Server ============ -->
  <rect x="440" y="48" width="320" height="255" rx="6" fill="#dae8fc" stroke="#000000" stroke-width="2"/>
  <text x="457" y="78" font-size="16" font-weight="700" fill="#000000">Main Server</text>
  <!-- server icon -->
  <rect x="461" y="128" width="62" height="20" rx="2" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="470" cy="138" r="2.5" fill="#000000"/>
  <rect x="461" y="152" width="62" height="20" rx="2" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="470" cy="162" r="2.5" fill="#000000"/>
  <rect x="461" y="176" width="62" height="20" rx="2" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="470" cy="186" r="2.5" fill="#000000"/>
  <text x="492" y="212" font-size="9" fill="#333333" text-anchor="middle">Level 3</text>

  <rect x="550" y="95" width="195" height="40" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="647" y="120" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">Process Manager</text>
  <rect x="550" y="152" width="195" height="40" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="647" y="177" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">재고 · 작업 이력</text>
  <rect x="550" y="209" width="195" height="40" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="647" y="234" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">Query API</text>
  <text x="600" y="272" font-size="10" fill="#1a4d80" text-anchor="middle">작업 지시를 승인하고 기록한다</text>

  <!-- ============ Database ============ -->
  <rect x="835" y="48" width="250" height="255" rx="6" fill="#e1d5e7" stroke="#000000" stroke-width="2"/>
  <text x="852" y="78" font-size="16" font-weight="700" fill="#000000">Database</text>
  <!-- cylinder icon -->
  <ellipse cx="882" cy="132" rx="26" ry="9" fill="none" stroke="#000000" stroke-width="2"/>
  <path d="M856,132 L856,172" stroke="#000000" stroke-width="2" fill="none"/>
  <path d="M908,132 L908,172" stroke="#000000" stroke-width="2" fill="none"/>
  <ellipse cx="882" cy="172" rx="26" ry="9" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="882" y="200" font-size="9" fill="#333333" text-anchor="middle">PostgreSQL</text>

  <rect x="925" y="95" width="145" height="40" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="997" y="120" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">production</text>
  <rect x="925" y="152" width="145" height="40" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="997" y="177" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">part_catalog</text>
  <rect x="925" y="209" width="145" height="40" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="997" y="234" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">defect_report</text>

  <!-- ============ Legend ============ -->
  <rect x="1160" y="48" width="280" height="215" rx="6" fill="#f5f5f5" stroke="#000000" stroke-width="2" stroke-dasharray="8 5"/>
  <line x1="1182" y1="92" x2="1252" y2="92" stroke="#1a73e8" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="1272" y="97" font-size="13" fill="#000000">ROS2</text>
  <line x1="1182" y1="134" x2="1252" y2="134" stroke="#00a352" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="1272" y="139" font-size="13" fill="#000000">HTTP/REST</text>
  <line x1="1182" y1="176" x2="1252" y2="176" stroke="#4d4d4d" stroke-width="2.5" marker-end="url(#s)"/>
  <text x="1272" y="181" font-size="13" fill="#000000">SQL</text>
  <rect x="1182" y="210" width="70" height="18" rx="3" fill="#ffffff" stroke="#999999" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="1272" y="224" font-size="13" fill="#666666">미구현</text>

