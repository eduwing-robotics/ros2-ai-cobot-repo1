<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="1060" viewBox="0 0 1580 1060" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">

  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1580" height="1060" fill="#ffffff"/>

  <!-- ===== Title ===== -->
  <text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">S/W Architecture — 현재 코드 기준 (2026-08-26)</text>
  <text x="40" y="64" font-size="13" fill="#475569">Unity와 Main Server는 같은 ROS2 조립 서비스를 호출하지만 서로를 경유하지 않는다. Start 버튼은 Unity 내부 호출이고, 컨베이어도 Unity 내부(MockConveyor)에서만 동작한다.</text>

  <!-- ===== GUI/DT (Unity) ===== -->
  <rect x="40" y="90" width="380" height="300" rx="8" fill="#fde4e6" stroke="#1f2937" stroke-width="2"/>
  <text x="58" y="120" font-size="17" font-weight="700" fill="#0f172a">GUI / DT (Unity)</text>
  <text x="398" y="120" font-size="9.5" fill="#9f1239" text-anchor="end">↓ 내부 C# 호출 (HTTP·ROS2 아님)</text>
  <rect x="65" y="132" width="330" height="32" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="230" y="153" font-size="11" fill="#0f172a" text-anchor="middle">RUN · INSPECT · MANUAL · QUALITY · 3D Visualization</text>
  <line x1="230" y1="164" x2="230" y2="180" stroke="#334155" stroke-width="1.8" marker-end="url(#ad)"/>
  <rect x="65" y="182" width="330" height="32" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="230" y="203" font-size="11" fill="#0f172a" text-anchor="middle">Start 버튼 → Scenario.Run()</text>
  <line x1="230" y1="214" x2="230" y2="230" stroke="#334155" stroke-width="1.8" marker-end="url(#ad)"/>
  <rect x="65" y="232" width="330" height="32" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="230" y="253" font-size="11" fill="#0f172a" text-anchor="middle">Scenario — 작업 순서 제어</text>
  <line x1="230" y1="264" x2="230" y2="280" stroke="#334155" stroke-width="1.8" marker-end="url(#ad)"/>
  <rect x="65" y="282" width="330" height="32" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="230" y="303" font-size="11" fill="#0f172a" text-anchor="middle">MockConveyor — 컨베이어 (Unity 내부)</text>
  <line x1="230" y1="314" x2="230" y2="330" stroke="#334155" stroke-width="1.8" marker-end="url(#ad)"/>
  <rect x="65" y="332" width="330" height="32" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="230" y="353" font-size="10" fill="#0f172a" text-anchor="middle">MockAssemblyScenarioControl — 조립 실행 클라이언트</text>

  <!-- ===== Main Server ===== -->
  <rect x="530" y="90" width="320" height="180" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
  <text x="548" y="122" font-size="17" font-weight="700" fill="#0f172a">Main Server</text>
  <rect x="555" y="140" width="270" height="40" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="690" y="165" font-size="12" fill="#0f172a" text-anchor="middle">Query API (읽기 전용)</text>
  <rect x="555" y="196" width="270" height="40" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="690" y="221" font-size="12" fill="#0f172a" text-anchor="middle">Assembly Gateway (HTTP → ROS2)</text>

  <!-- ===== PostgreSQL ===== -->
  <rect x="950" y="90" width="260" height="230" rx="8" fill="#e2e8f0" stroke="#1f2937" stroke-width="2"/>
  <text x="968" y="122" font-size="17" font-weight="700" fill="#0f172a">PostgreSQL</text>
  <rect x="975" y="140" width="210" height="40" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="1080" y="165" font-size="12" fill="#0f172a" text-anchor="middle">production</text>
  <rect x="975" y="192" width="210" height="40" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="1080" y="217" font-size="12" fill="#0f172a" text-anchor="middle">part_catalog</text>
  <rect x="975" y="244" width="210" height="40" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="1080" y="269" font-size="12" fill="#0f172a" text-anchor="middle">defect_report</text>

  <!-- ===== Legend ===== -->
  <rect x="1270" y="90" width="270" height="215" rx="8" fill="#f8fafc" stroke="#1f2937" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1288" y="122" font-size="17" font-weight="700" fill="#0f172a">범례</text>
  <line x1="1290" y1="150" x2="1350" y2="150" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="1364" y="155" font-size="13" fill="#0f172a">ROS2</text>
  <line x1="1290" y1="190" x2="1350" y2="190" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="1364" y="195" font-size="13" fill="#0f172a">HTTP / REST</text>
  <line x1="1290" y1="230" x2="1350" y2="230" stroke="#475569" stroke-width="2.5" marker-end="url(#as)"/>
  <text x="1364" y="235" font-size="13" fill="#0f172a">SQL (DB 접근)</text>
  <rect x="1290" y="262" width="60" height="16" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="1364" y="275" font-size="13" fill="#0f172a">미구현 · 계획</text>

  <!-- ===== ROS-TCP Endpoint ===== -->
  <rect x="100" y="430" width="280" height="70" rx="8" fill="#f1f5f9" stroke="#1f2937" stroke-width="2"/>
  <text x="240" y="461" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">ROS-TCP Endpoint</text>
  <text x="240" y="481" font-size="12" fill="#334155" text-anchor="middle">/UnityEndpoint</text>

  <!-- ===== mock_db_bridge ===== -->
  <rect x="560" y="430" width="340" height="70" rx="8" fill="#fef3c7" stroke="#1f2937" stroke-width="2"/>
  <text x="730" y="461" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">mock_db_bridge</text>
  <text x="730" y="481" font-size="12" fill="#334155" text-anchor="middle">Job · Unit · 재고 · 검사 기록 후 COMPLETED 발행</text>

  <!-- ===== 외부 카메라 ===== -->
  <rect x="1170" y="430" width="240" height="70" rx="8" fill="#f8fafc" stroke="#1f2937" stroke-width="2"/>
  <text x="1290" y="461" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">외부 카메라</text>
  <text x="1290" y="481" font-size="12" fill="#334155" text-anchor="middle">Intel D435</text>

  <!-- ===== FR5 Control ===== -->
  <rect x="440" y="560" width="340" height="300" rx="8" fill="#fdeec2" stroke="#1f2937" stroke-width="2"/>
  <text x="458" y="592" font-size="17" font-weight="700" fill="#0f172a">FR5 Control (mock_movej)</text>
  <rect x="470" y="615" width="280" height="44" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="610" y="642" font-size="12" fill="#0f172a" text-anchor="middle">Motion Planning (MoveIt)</text>
  <line x1="610" y1="659" x2="610" y2="698" stroke="#334155" stroke-width="2" marker-end="url(#ad)"/>
  <rect x="470" y="700" width="280" height="44" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="610" y="727" font-size="12" fill="#0f172a" text-anchor="middle">Pick &amp; Place</text>
  <line x1="610" y1="744" x2="610" y2="783" stroke="#334155" stroke-width="2" marker-end="url(#ad)"/>
  <rect x="470" y="785" width="280" height="44" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="610" y="812" font-size="12" fill="#0f172a" text-anchor="middle">Gripper</text>

  <!-- ===== Vision / AI Server ===== -->
  <rect x="900" y="560" width="460" height="200" rx="8" fill="#cffafe" stroke="#1f2937" stroke-width="2"/>
  <text x="918" y="592" font-size="17" font-weight="700" fill="#0f172a">Vision / AI Server</text>
  <rect x="920" y="615" width="200" height="44" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="1020" y="642" font-size="12" fill="#0f172a" text-anchor="middle">PCB Alignment / 검출</text>
  <rect x="1140" y="615" width="200" height="44" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="1240" y="642" font-size="12" fill="#64748b" text-anchor="middle">Defect Inspection</text>
  <rect x="920" y="680" width="200" height="44" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="1020" y="707" font-size="12" fill="#64748b" text-anchor="middle">Precision Placement</text>
  <rect x="1140" y="680" width="200" height="44" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="1240" y="707" font-size="12" fill="#64748b" text-anchor="middle">Factory Monitoring</text>

  <!-- ===== Arrows ===== -->

  <!-- A. Unity -> Main Server : HTTP -->
  <line x1="420" y1="200" x2="528" y2="200" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="474" y="190" font-size="10" fill="#166534" text-anchor="middle">HTTP GET</text>
  <text x="474" y="222" font-size="10" fill="#166534" text-anchor="middle">/api/v1/*</text>

  <!-- B. Main Server -> DB : SQL read -->
  <line x1="850" y1="160" x2="948" y2="160" stroke="#475569" stroke-width="2.5" marker-end="url(#as)"/>
  <text x="899" y="150" font-size="10" fill="#334155" text-anchor="middle">SQL read-only</text>

  <!-- C. Unity <-> ROS-TCP Endpoint : ROS2 -->
  <line x1="190" y1="392" x2="190" y2="428" stroke="#2563eb" stroke-width="2.5" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <text x="200" y="415" font-size="10" fill="#1d4ed8">ROS2</text>

  <!-- D. Endpoint <-> mock_db_bridge : assembly contract -->
  <line x1="382" y1="465" x2="558" y2="465" stroke="#2563eb" stroke-width="2.5" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <text x="470" y="455" font-size="10" fill="#1d4ed8" text-anchor="middle">/unity/assembly/start</text>
  <text x="470" y="484" font-size="10" fill="#1d4ed8" text-anchor="middle">/unity/assembly/feedback</text>

  <!-- E. Main Server -> mock_db_bridge : second entry point -->
  <line x1="620" y1="272" x2="620" y2="428" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="632" y="340" font-size="10" fill="#1d4ed8">POST /api/v1/assemblies →</text>
  <text x="632" y="356" font-size="10" fill="#1d4ed8">/unity/assembly/start</text>
  <text x="632" y="372" font-size="10" fill="#64748b">(Unity를 경유하지 않는 별도 진입점)</text>

  <!-- F. mock_db_bridge <-> FR5 Control -->
  <line x1="700" y1="502" x2="700" y2="558" stroke="#2563eb" stroke-width="2.5" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <text x="712" y="535" font-size="10" fill="#1d4ed8">내부 remap</text>

  <!-- G. mock_db_bridge -> DB : SQL write -->
  <polyline points="902,465 1060,465 1060,322" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#as)"/>
  <text x="1000" y="487" font-size="9" fill="#334155" text-anchor="middle">SQL write (Job · Unit · 재고 · 검사)</text>

  <!-- H. Vision -> Unity HUD -->
  <polyline points="1000,762 1000,890 290,890 290,502" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="700" y="882" font-size="10" fill="#1d4ed8" text-anchor="middle">/vision/board/image · capture/target_pose · selected_target → Unity HUD</text>

  <!-- I. 외부 카메라 -> Vision -->
  <line x1="1290" y1="502" x2="1290" y2="558" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="1302" y="535" font-size="10" fill="#1d4ed8">카메라 스트림</text>

  <!-- ===== 미구현 · 계획 ===== -->
  <rect x="40" y="920" width="1500" height="110" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="58" y="950" font-size="15" font-weight="700" fill="#475569">미구현 · 계획</text>
  <rect x="70" y="962" width="345" height="46" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="242" y="984" font-size="11" fill="#64748b" text-anchor="middle">Stop · 비상정지 명령 (Unity → 로봇)</text>
  <text x="242" y="999" font-size="10" fill="#94a3b8" text-anchor="middle">SR-12 · SR-15 — 조립 취소 계약 없음</text>
  <rect x="435" y="962" width="345" height="46" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="607" y="990" font-size="11" fill="#64748b" text-anchor="middle">Conveyor 실물 ROS2 제어</text>
  <rect x="800" y="962" width="345" height="46" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="972" y="990" font-size="10" fill="#64748b" text-anchor="middle">Real 자동 조립 (RealAssemblyScenarioControl)</text>
  <rect x="1165" y="962" width="345" height="46" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="1337" y="990" font-size="11" fill="#64748b" text-anchor="middle">AI 불량 검사 · Factory Monitoring</text>

  <text x="40" y="1050" font-size="11" fill="#64748b">※ E-STOP은 Real `/nonrt_state_data` 프레임의 EmergencyStop 비트를 수신해 표시만 한다 — Unity에서 정지 명령을 보내는 경로는 없다.</text>

</svg>
