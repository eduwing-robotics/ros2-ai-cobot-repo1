  <line x1="1148" y1="460" x2="982" y2="460" stroke="#1a73e8" stroke-width="2.6" marker-end="url(#mb)"/>

  <!-- Video Streamer -> PCB Alignment -->
  <line x1="1300" y1="678" x2="1300" y2="502" stroke="#9933cc" stroke-width="2.6" marker-end="url(#mp)"/>

