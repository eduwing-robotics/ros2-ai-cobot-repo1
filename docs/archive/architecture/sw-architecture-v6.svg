  <!-- ==================== ARROWS ==================== -->

  <!-- Network Manager -> System Monitor : HTTP 조회 응답 -->
  <line x1="648" y1="170" x2="429" y2="170" stroke="#00a352" stroke-width="2.6" marker-end="url(#mg)"/>

  <!-- Run Control -> Network Manager : HTTP 작업 지시 -->
  <polyline points="427,320 700,320 700,217" fill="none" stroke="#00a352" stroke-width="2.6" marker-end="url(#mg)"/>

  <!-- Network Manager <-> Task Manager -->
  <line x1="832" y1="177" x2="848" y2="177" stroke="#000000" stroke-width="2" marker-start="url(#mk)" marker-end="url(#mk)"/>

  <!-- Task Manager <-> DB -->
  <line x1="1032" y1="177" x2="1066" y2="177" stroke="#000000" stroke-width="2" marker-start="url(#mk)" marker-end="url(#mk)"/>

  <!-- Network Manager <-> Assembly Sequencer -->
  <line x1="760" y1="217" x2="760" y2="418" stroke="#1a73e8" stroke-width="2.6" marker-start="url(#mb)" marker-end="url(#mb)"/>

  <!-- Assembly Sequencer <-> Motion Controller -->
  <line x1="700" y1="502" x2="700" y2="668" stroke="#1a73e8" stroke-width="2.6" marker-start="url(#mb)" marker-end="url(#mb)"/>

