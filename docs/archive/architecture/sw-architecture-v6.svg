  <polyline points="1200,418 1200,330 470,330 470,190 429,190" fill="none" stroke="#9933cc" stroke-width="2.6" marker-end="url(#mp)"/>

  <!-- Assembly Sequencer -> System Monitor : 텔레메트리 -->
  <polyline points="638,478 490,478 490,150 429,150" fill="none" stroke="#1a73e8" stroke-width="2.6" marker-end="url(#mb)"/>

</svg>
