  <line x1="969" y1="458" x2="969" y2="449" stroke="#2b3440" stroke-width="1.8"/>
  <line x1="983" y1="458" x2="983" y2="449" stroke="#2b3440" stroke-width="1.8"/>
  <line x1="955" y1="508" x2="955" y2="517" stroke="#2b3440" stroke-width="1.8"/>
  <line x1="969" y1="508" x2="969" y2="517" stroke="#2b3440" stroke-width="1.8"/>
  <line x1="983" y1="508" x2="983" y2="517" stroke="#2b3440" stroke-width="1.8"/>
  <line x1="1032" y1="375" x2="1032" y2="545" stroke="#6b7785" stroke-width="1.4"/>

  <rect x="1065" y="430" width="210" height="75" rx="12" fill="#f7f9fa" stroke="#2b3440" stroke-width="1.6"/>
  <text x="1170" y="462" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">PCB</text>
  <text x="1170" y="482" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Alignment</text>

  <rect x="1300" y="430" width="210" height="75" rx="12" fill="#f7f9fa" stroke="#9aa4ad" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="1405" y="462" font-size="14" font-weight="700" fill="#6b7785" text-anchor="middle">Defect</text>
  <text x="1405" y="482" font-size="14" font-weight="700" fill="#6b7785" text-anchor="middle">Inspection</text>

  <!-- ==================== FR5 Arm ==================== -->
  <rect x="90" y="670" width="520" height="245" rx="22" fill="#dde5ec" stroke="#6b7785" stroke-width="1.6"/>
  <text x="118" y="702" font-size="17" font-weight="700" fill="#1f2937">FR5 Arm</text>
  <line x1="152" y1="852" x2="152" y2="800" stroke="#2b3440" stroke-width="2.4"/>
  <line x1="152" y1="800" x2="186" y2="772" stroke="#2b3440" stroke-width="2.4"/>
  <line x1="186" y1="772" x2="186" y2="754" stroke="#2b3440" stroke-width="2.4"/>
  <circle cx="152" cy="800" r="4.5" fill="none" stroke="#2b3440" stroke-width="1.8"/>
  <circle cx="186" cy="772" r="4.5" fill="none" stroke="#2b3440" stroke-width="1.8"/>
  <line x1="178" y1="750" x2="194" y2="750" stroke="#2b3440" stroke-width="2.4"/>
  <rect x="130" y="852" width="44" height="10" rx="2" fill="none" stroke="#2b3440" stroke-width="1.8"/>
  <line x1="220" y1="695" x2="220" y2="890" stroke="#6b7785" stroke-width="1.4"/>

  <rect x="245" y="705" width="340" height="55" rx="12" fill="#f7f9fa" stroke="#2b3440" stroke-width="1.6"/>
