  <line x1="415" y1="762" x2="415" y2="777" stroke="#2b3440" stroke-width="1.6" marker-end="url(#mk)"/>
  <rect x="245" y="780" width="340" height="55" rx="12" fill="#f7f9fa" stroke="#2b3440" stroke-width="1.6"/>
  <text x="415" y="813" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Motion Planner (MoveIt)</text>
  <line x1="415" y1="837" x2="415" y2="852" stroke="#2b3440" stroke-width="1.6" marker-end="url(#mk)"/>
  <rect x="245" y="855" width="340" height="55" rx="12" fill="#f7f9fa" stroke="#2b3440" stroke-width="1.6"/>
  <text x="415" y="888" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Gripper Control</text>

  <!-- ==================== Conveyor ==================== -->
