  <text x="118" y="168" font-size="17" font-weight="700" fill="#1f2937">(Unity)</text>
  <rect x="126" y="182" width="52" height="36" rx="3" fill="none" stroke="#2b3440" stroke-width="2"/>
  <line x1="152" y1="218" x2="152" y2="228" stroke="#2b3440" stroke-width="2"/>
  <line x1="136" y1="228" x2="168" y2="228" stroke="#2b3440" stroke-width="2"/>
