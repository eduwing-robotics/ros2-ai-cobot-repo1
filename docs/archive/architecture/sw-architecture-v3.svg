  <text x="565" y="482" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Gateway</text>

  <ellipse cx="760" cy="432" rx="42" ry="12" fill="#f7f9fa" stroke="#2b3440" stroke-width="1.6"/>
  <path d="M718,432 L718,494" stroke="#2b3440" stroke-width="1.6" fill="none"/>
  <path d="M802,432 L802,494" stroke="#2b3440" stroke-width="1.6" fill="none"/>
  <path d="M718,494 A42,12 0 0 0 802,494" stroke="#2b3440" stroke-width="1.6" fill="none"/>
  <ellipse cx="760" cy="462" rx="42" ry="12" fill="none" stroke="#2b3440" stroke-width="1.2"/>
  <text x="760" y="522" font-size="11" fill="#4b5563" text-anchor="middle">PostgreSQL</text>

