  <line x1="1180" y1="122" x2="1268" y2="122" stroke="#c0392b" stroke-width="2.6" marker-end="url(#mr)"/>
  <text x="1292" y="128" font-size="16" font-weight="600" fill="#1f2937">HTTP / REST</text>
  <line x1="1180" y1="164" x2="1268" y2="164" stroke="#d98218" stroke-width="2.6" marker-end="url(#mo)"/>
