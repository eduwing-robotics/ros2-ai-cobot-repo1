  <text x="678" y="762" font-size="17" font-weight="700" fill="#1f2937">Conveyor</text>
  <rect x="682" y="790" width="72" height="13" rx="3" fill="none" stroke="#2b3440" stroke-width="1.8"/>
  <circle cx="694" cy="815" r="9" fill="none" stroke="#2b3440" stroke-width="1.8"/>
  <circle cx="718" cy="815" r="9" fill="none" stroke="#2b3440" stroke-width="1.8"/>
  <circle cx="742" cy="815" r="9" fill="none" stroke="#2b3440" stroke-width="1.8"/>
  <line x1="686" y1="830" x2="750" y2="830" stroke="#2b3440" stroke-width="1.8"/>
  <line x1="780" y1="695" x2="780" y2="890" stroke="#6b7785" stroke-width="1.4"/>

  <rect x="805" y="740" width="240" height="55" rx="12" fill="#f7f9fa" stroke="#9aa4ad" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="925" y="773" font-size="14" font-weight="700" fill="#6b7785" text-anchor="middle">Drive Controller</text>
  <rect x="805" y="815" width="240" height="55" rx="12" fill="#f7f9fa" stroke="#9aa4ad" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="925" y="848" font-size="14" font-weight="700" fill="#6b7785" text-anchor="middle">Position Control</text>

  <!-- ==================== Global Camera ==================== -->
  <rect x="1110" y="670" width="420" height="245" rx="22" fill="#dde5ec" stroke="#6b7785" stroke-width="1.6"/>
  <text x="1138" y="762" font-size="17" font-weight="700" fill="#1f2937">Global</text>
  <text x="1138" y="784" font-size="17" font-weight="700" fill="#1f2937">Camera</text>
  <rect x="1146" y="806" width="52" height="34" rx="4" fill="none" stroke="#2b3440" stroke-width="1.8"/>
  <circle cx="1172" cy="823" r="10" fill="none" stroke="#2b3440" stroke-width="1.8"/>
  <rect x="1158" y="798" width="18" height="8" rx="2" fill="none" stroke="#2b3440" stroke-width="1.8"/>
  <line x1="1240" y1="695" x2="1240" y2="890" stroke="#6b7785" stroke-width="1.4"/>

  <rect x="1265" y="780" width="240" height="55" rx="12" fill="#f7f9fa" stroke="#2b3440" stroke-width="1.6"/>
  <text x="1385" y="813" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Video Streamer</text>

  <!-- ==================== ARROWS ==================== -->

  <!-- 1. Run Control -> API Gateway (HTTP) -->
  <line x1="605" y1="207" x2="605" y2="426" stroke="#c0392b" stroke-width="2.6" marker-end="url(#mr)"/>

  <!-- 2. API Gateway -> Monitor (HTTP) -->
  <polyline points="490,428 490,300 355,300 355,209" fill="none" stroke="#c0392b" stroke-width="2.6" marker-end="url(#mr)"/>

  <!-- 3. Task Manager <-> API Gateway -->
  <line x1="437" y1="467" x2="468" y2="467" stroke="#2b3440" stroke-width="1.8" marker-start="url(#mk)" marker-end="url(#mk)"/>

  <!-- 4. API Gateway <-> DB -->
  <line x1="662" y1="467" x2="716" y2="467" stroke="#2b3440" stroke-width="1.8" marker-start="url(#mk)" marker-end="url(#mk)"/>

  <!-- 5. API Gateway <-> Assembly Sequencer (ROS2) -->
  <line x1="520" y1="507" x2="520" y2="703" stroke="#d98218" stroke-width="2.6" marker-start="url(#mo)" marker-end="url(#mo)"/>

  <!-- 6. API Gateway -> Drive Controller (ROS2, 미구현) -->
  <polyline points="630,507 630,615 925,615 925,738" fill="none" stroke="#d98218" stroke-width="2.6" stroke-dasharray="7 4" marker-end="url(#mo)"/>

  <!-- 7. PCB Alignment -> Assembly Sequencer (ROS2) -->
  <polyline points="1100,507 1100,650 400,650 400,703" fill="none" stroke="#d98218" stroke-width="2.6" marker-end="url(#mo)"/>

  <!-- 8. Video Streamer -> PCB Alignment -->
  <polyline points="1300,778 1300,630 1170,630 1170,507" fill="none" stroke="#2f6fd0" stroke-width="2.6" marker-end="url(#mu)"/>

  <!-- 9. PCB Alignment -> Monitor (HUD 영상) -->
  <polyline points="1220,428 1220,320 410,320 410,209" fill="none" stroke="#2f6fd0" stroke-width="2.6" marker-end="url(#mu)"/>

  <!-- 10. Assembly Sequencer -> Monitor (텔레메트리, 서버 우회) -->
  <polyline points="243,732 60,732 60,52 300,52 300,131" fill="none" stroke="#d98218" stroke-width="2.6" marker-end="url(#mo)"/>

  <!-- footer -->
  <text x="90" y="950" font-size="11.5" fill="#6b7785">지시는 Main Server를 거치고, 관절 상태·영상 스트림은 GUI/DT로 직접 간다. 조립 스텝 실행은 FR5 Arm이, 작업 접수·승인·기록은 Main Server가 소유한다.</text>

</svg>
