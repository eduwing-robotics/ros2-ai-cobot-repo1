  <text x="340" y="462" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Task</text>
  <text x="340" y="482" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Manager</text>

  <rect x="470" y="430" width="190" height="75" rx="12" fill="#f7f9fa" stroke="#2b3440" stroke-width="1.6"/>
