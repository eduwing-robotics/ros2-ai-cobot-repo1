  <rect x="910" y="350" width="620" height="220" rx="22" fill="#e8ecef" stroke="#6b7785" stroke-width="1.6"/>
  <text x="938" y="418" font-size="17" font-weight="700" fill="#1f2937">Vision</text>
  <text x="938" y="440" font-size="17" font-weight="700" fill="#1f2937">AI Server</text>
