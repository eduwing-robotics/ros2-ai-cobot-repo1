  <polyline points="955,327 955,460 1400,460 1400,593" fill="none" stroke="#1a73e8" stroke-width="2.6" stroke-dasharray="7 4" marker-end="url(#mb)"/>

  <!-- PCB Alignment -> Assembly Sequencer -->
  <line x1="700" y1="593" x2="700" y2="327" stroke="#1a73e8" stroke-width="2.6" stroke-dasharray="7 4" marker-end="url(#mb)"/>

  <!-- Video Streamer -> PCB Alignment -->
  <line x1="412" y1="625" x2="548" y2="625" stroke="#9933cc" stroke-width="2.6" stroke-dasharray="7 4" marker-end="url(#mp)"/>

  <!-- PCB Alignment -> System Monitor : HUD 영상 -->
  <polyline points="560,593 560,470 440,470 440,320 412,320" fill="none" stroke="#9933cc" stroke-width="2.6" stroke-dasharray="7 4" marker-end="url(#mp)"/>

  <!-- footer -->
  <text x="90" y="800" font-size="11.5" fill="#555555">Unity · Main Server · Assembly Sequencer · PostgreSQL 은 모두 같은 제어 PC에서 실행된다 (127.0.0.1). 프로세스는 분리되어 있다.</text>

</svg>
