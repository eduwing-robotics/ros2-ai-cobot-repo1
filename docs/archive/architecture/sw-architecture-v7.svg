  <text x="1400" y="706" font-size="14" font-weight="700" fill="#666666" text-anchor="middle">Position Control</text>

  <!-- ==================== ARROWS ==================== -->

  <!-- Run Control -> Network Manager -->
  <line x1="412" y1="155" x2="608" y2="155" stroke="#00a352" stroke-width="2.6" marker-end="url(#mg)"/>

  <!-- Network Manager -> System Monitor -->
  <polyline points="608,190 450,190 450,270 412,270" fill="none" stroke="#00a352" stroke-width="2.6" marker-end="url(#mg)"/>

  <!-- Network Manager <-> Task Manager -->
  <line x1="782" y1="167" x2="798" y2="167" stroke="#000000" stroke-width="2" marker-start="url(#mk)" marker-end="url(#mk)"/>

  <!-- Task Manager <-> DB -->
  <line x1="972" y1="167" x2="1034" y2="167" stroke="#000000" stroke-width="2" marker-start="url(#mk)" marker-end="url(#mk)"/>

  <!-- Network Manager <-> Assembly Sequencer -->
  <line x1="680" y1="205" x2="680" y2="250" stroke="#1a73e8" stroke-width="2.6" marker-start="url(#mb)" marker-end="url(#mb)"/>

  <!-- Assembly Sequencer -> System Monitor : 텔레메트리 -->
  <line x1="608" y1="295" x2="412" y2="295" stroke="#1a73e8" stroke-width="2.6" marker-end="url(#mb)"/>

  <!-- Assembly Sequencer <-> Motion Controller -->
  <line x1="940" y1="327" x2="940" y2="593" stroke="#1a73e8" stroke-width="2.6" marker-start="url(#mb)" marker-end="url(#mb)"/>

