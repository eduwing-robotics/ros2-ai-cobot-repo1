  <rect x="1145" y="252" width="58" height="17" rx="2" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="1154" cy="260" r="2.5" fill="#000000"/>
  <rect x="1145" y="275" width="58" height="17" rx="2" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="1154" cy="283" r="2.5" fill="#000000"/>
