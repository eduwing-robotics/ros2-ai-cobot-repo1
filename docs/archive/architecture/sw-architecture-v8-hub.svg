<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="920" viewBox="0 0 1580 920" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">

  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#dcdcdc"/>
    </pattern>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/>
    </marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00a352"/>
    </marker>
    <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9933cc"/>
    </marker>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="1580" height="920" fill="#ffffff"/>
  <rect width="1580" height="920" fill="url(#dots)"/>

  <!-- ============ GUI / DT ============ -->
  <rect x="90" y="80" width="620" height="180" rx="6" fill="#f8cecc" stroke="#000000" stroke-width="2"/>
  <text x="112" y="114" font-size="17" font-weight="700" fill="#000000">GUI/DT</text>
  <rect x="118" y="150" width="60" height="42" rx="3" fill="none" stroke="#000000" stroke-width="2"/>
  <rect x="128" y="160" width="40" height="22" rx="2" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="148" y1="192" x2="148" y2="204" stroke="#000000" stroke-width="2"/>
  <line x1="130" y1="204" x2="166" y2="204" stroke="#000000" stroke-width="2"/>

  <rect x="215" y="125" width="220" height="80" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="325" y="158" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">System</text>
  <text x="325" y="178" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Monitor</text>

  <rect x="465" y="125" width="220" height="80" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="575" y="158" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Run</text>
  <text x="575" y="178" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Control</text>

  <!-- ============ Legend ============ -->
  <rect x="1150" y="80" width="380" height="180" rx="6" fill="#f5f5f5" stroke="#000000" stroke-width="2" stroke-dasharray="8 5"/>
  <line x1="1180" y1="122" x2="1258" y2="122" stroke="#1a73e8" stroke-width="2.6" marker-end="url(#mb)"/>
  <text x="1280" y="128" font-size="16" font-weight="600" fill="#000000">ROS2</text>
  <line x1="1180" y1="168" x2="1258" y2="168" stroke="#00a352" stroke-width="2.6" marker-end="url(#mg)"/>
  <text x="1280" y="174" font-size="16" font-weight="600" fill="#000000">HTTP/REST</text>
  <line x1="1180" y1="214" x2="1258" y2="214" stroke="#9933cc" stroke-width="2.6" marker-end="url(#mp)"/>
  <text x="1280" y="220" font-size="16" font-weight="600" fill="#000000">Video Stream</text>

  <!-- ============ Main Server ============ -->
  <rect x="90" y="340" width="800" height="220" rx="6" fill="#dae8fc" stroke="#000000" stroke-width="2"/>
  <text x="112" y="374" font-size="17" font-weight="700" fill="#000000">Main Server</text>
  <rect x="118" y="410" width="58" height="17" rx="2" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="127" cy="418" r="2.5" fill="#000000"/>
  <rect x="118" y="433" width="58" height="17" rx="2" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="127" cy="441" r="2.5" fill="#000000"/>
  <rect x="118" y="456" width="58" height="17" rx="2" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="127" cy="464" r="2.5" fill="#000000"/>

  <rect x="215" y="410" width="180" height="80" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="305" y="443" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Task</text>
  <text x="305" y="463" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Manager</text>

  <rect x="425" y="410" width="180" height="80" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="515" y="443" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Network</text>
  <text x="515" y="463" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Manager</text>

  <ellipse cx="700" cy="418" rx="42" ry="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <path d="M658,418 L658,472" stroke="#000000" stroke-width="2" fill="none"/>
  <path d="M742,418 L742,472" stroke="#000000" stroke-width="2" fill="none"/>
  <path d="M658,472 A42,12 0 0 0 742,472" stroke="#000000" stroke-width="2" fill="none"/>
  <ellipse cx="700" cy="444" rx="42" ry="12" fill="none" stroke="#000000" stroke-width="1.4"/>

  <!-- ============ Vision / AI Server ============ -->
  <rect x="950" y="340" width="580" height="220" rx="6" fill="#b0e3e6" stroke="#000000" stroke-width="2"/>
  <text x="972" y="374" font-size="17" font-weight="700" fill="#000000">Vision/AI Server</text>
  <rect x="978" y="420" width="52" height="52" rx="4" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="1004" y="452" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">AI</text>
  <line x1="990" y1="420" x2="990" y2="411" stroke="#000000" stroke-width="2"/>
  <line x1="1004" y1="420" x2="1004" y2="411" stroke="#000000" stroke-width="2"/>
  <line x1="1018" y1="420" x2="1018" y2="411" stroke="#000000" stroke-width="2"/>
  <line x1="990" y1="472" x2="990" y2="481" stroke="#000000" stroke-width="2"/>
  <line x1="1004" y1="472" x2="1004" y2="481" stroke="#000000" stroke-width="2"/>
  <line x1="1018" y1="472" x2="1018" y2="481" stroke="#000000" stroke-width="2"/>

  <rect x="1065" y="380" width="430" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="1280" y="422" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">PCB Alignment</text>

  <rect x="1065" y="470" width="430" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="1280" y="512" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Defect Inspection</text>

  <!-- ============ FR5 Arm ============ -->
  <rect x="90" y="640" width="440" height="240" rx="6" fill="#fff2cc" stroke="#000000" stroke-width="2"/>
  <text x="112" y="674" font-size="17" font-weight="700" fill="#000000">FR5 Arm</text>
  <line x1="140" y1="840" x2="140" y2="796" stroke="#000000" stroke-width="2.5"/>
  <line x1="140" y1="796" x2="168" y2="772" stroke="#000000" stroke-width="2.5"/>
  <line x1="168" y1="772" x2="168" y2="757" stroke="#000000" stroke-width="2.5"/>
  <circle cx="140" cy="796" r="5" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="168" cy="772" r="5" fill="none" stroke="#000000" stroke-width="2"/>
  <line x1="160" y1="753" x2="176" y2="753" stroke="#000000" stroke-width="2.5"/>
  <rect x="120" y="840" width="40" height="10" rx="2" fill="none" stroke="#000000" stroke-width="2"/>

  <rect x="205" y="680" width="300" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="355" y="722" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Assembly Sequencer</text>
  <rect x="205" y="780" width="300" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="355" y="822" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Motion Controller</text>

  <!-- ============ Conveyor ============ -->
  <rect x="570" y="640" width="420" height="240" rx="6" fill="#ffcce6" stroke="#000000" stroke-width="2"/>
  <text x="592" y="674" font-size="17" font-weight="700" fill="#000000">Conveyor</text>
  <rect x="596" y="782" width="60" height="12" rx="3" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="607" cy="806" r="9" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="628" cy="806" r="9" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="649" cy="806" r="9" fill="none" stroke="#000000" stroke-width="2"/>
  <line x1="599" y1="821" x2="657" y2="821" stroke="#000000" stroke-width="2"/>

  <rect x="690" y="680" width="280" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="830" y="722" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Drive Controller</text>
  <rect x="690" y="780" width="280" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="830" y="822" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Position Control</text>

  <!-- ============ Global Camera ============ -->
  <rect x="1030" y="640" width="500" height="240" rx="6" fill="#d5e8d4" stroke="#000000" stroke-width="2"/>
  <text x="1052" y="674" font-size="17" font-weight="700" fill="#000000">Global Camera</text>
  <rect x="1058" y="750" width="56" height="36" rx="4" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="1086" cy="768" r="10" fill="none" stroke="#000000" stroke-width="2"/>
  <rect x="1070" y="742" width="18" height="8" rx="2" fill="none" stroke="#000000" stroke-width="2"/>

  <rect x="1150" y="730" width="350" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="1325" y="772" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Video Streamer</text>

  <!-- ==================== ARROWS — 전부 Network Manager 로 수렴 ==================== -->

  <!-- Run Control -> Network Manager -->
  <line x1="530" y1="207" x2="530" y2="408" stroke="#00a352" stroke-width="2.6" marker-end="url(#mg)"/>

  <!-- Network Manager -> System Monitor -->
  <polyline points="470,408 470,300 325,300 325,207" fill="none" stroke="#00a352" stroke-width="2.6" marker-end="url(#mg)"/>

  <!-- Network Manager <-> Task Manager -->
  <line x1="397" y1="450" x2="423" y2="450" stroke="#000000" stroke-width="2" marker-start="url(#mk)" marker-end="url(#mk)"/>

  <!-- Network Manager <-> DB -->
  <line x1="607" y1="450" x2="656" y2="450" stroke="#000000" stroke-width="2" marker-start="url(#mk)" marker-end="url(#mk)"/>

  <!-- Network Manager <-> Assembly Sequencer -->
  <line x1="490" y1="492" x2="490" y2="678" stroke="#1a73e8" stroke-width="2.6" marker-start="url(#mb)" marker-end="url(#mb)"/>

  <!-- Network Manager <-> Drive Controller -->
  <polyline points="560,492 560,600 830,600 830,678" fill="none" stroke="#1a73e8" stroke-width="2.6" marker-start="url(#mb)" marker-end="url(#mb)"/>

  <!-- PCB Alignment -> Network Manager -->
  <polyline points="1100,378 1100,310 580,310 580,408" fill="none" stroke="#1a73e8" stroke-width="2.6" marker-end="url(#mb)"/>

  <!-- Video Streamer -> PCB Alignment (허브 우회) -->
  <polyline points="1300,728 1300,600 1048,600 1048,415 1063,415" fill="none" stroke="#9933cc" stroke-width="2.6" marker-end="url(#mp)"/>

  <!-- Assembly Sequencer -> Motion Controller -->
  <line x1="355" y1="752" x2="355" y2="778" stroke="#000000" stroke-width="2" marker-end="url(#mk)"/>

  <!-- Position Control -> Drive Controller -->
  <line x1="830" y1="778" x2="830" y2="752" stroke="#000000" stroke-width="2" marker-end="url(#mk)"/>

</svg>
