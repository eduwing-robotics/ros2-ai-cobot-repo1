<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="975" viewBox="0 0 1580 975" font-family="'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">

  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#dcdcdc"/>
    </pattern>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/>
    </marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00a352"/>
    </marker>
    <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9933cc"/>
    </marker>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="1580" height="975" fill="#ffffff"/>
  <rect width="1580" height="975" fill="url(#dots)"/>

  <!-- ==================== GUI/DT ==================== -->
  <rect x="90" y="80" width="660" height="180" rx="6" fill="#f8cecc" stroke="#000000" stroke-width="2"/>
  <text x="110" y="114" font-size="17" font-weight="700" fill="#000000">GUI/DT</text>
  <rect x="126" y="146" width="60" height="42" rx="3" fill="none" stroke="#000000" stroke-width="2"/>
  <rect x="135" y="155" width="42" height="24" rx="2" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="156" y1="188" x2="156" y2="200" stroke="#000000" stroke-width="2"/>
  <line x1="138" y1="200" x2="174" y2="200" stroke="#000000" stroke-width="2"/>
  <text x="156" y="222" font-size="10" fill="#333333" text-anchor="middle">Unity</text>

  <rect x="245" y="135" width="220" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="355" y="167" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Monitor</text>
  <text x="355" y="187" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">3D Twin</text>

  <rect x="495" y="135" width="220" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="605" y="167" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Run</text>
  <text x="605" y="187" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Control</text>

  <!-- ==================== Legend ==================== -->
  <rect x="1150" y="80" width="380" height="200" rx="6" fill="#f5f5f5" stroke="#000000" stroke-width="2" stroke-dasharray="8 5"/>
  <line x1="1180" y1="122" x2="1268" y2="122" stroke="#1a73e8" stroke-width="2.6" marker-end="url(#mb)"/>
  <text x="1292" y="128" font-size="16" font-weight="600" fill="#000000">ROS2</text>
  <line x1="1180" y1="164" x2="1268" y2="164" stroke="#00a352" stroke-width="2.6" marker-end="url(#mg)"/>
  <text x="1292" y="170" font-size="16" font-weight="600" fill="#000000">HTTP/REST</text>
  <line x1="1180" y1="206" x2="1268" y2="206" stroke="#9933cc" stroke-width="2.6" marker-end="url(#mp)"/>
  <text x="1292" y="212" font-size="16" font-weight="600" fill="#000000">Video Stream</text>
  <rect x="1180" y="238" width="88" height="20" rx="3" fill="#ffffff" stroke="#999999" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="1292" y="254" font-size="16" font-weight="600" fill="#666666">미구현</text>

  <!-- ==================== Main Server ==================== -->
  <rect x="90" y="350" width="760" height="220" rx="6" fill="#dae8fc" stroke="#000000" stroke-width="2"/>
  <text x="110" y="384" font-size="17" font-weight="700" fill="#000000">Main Server</text>
  <rect x="126" y="416" width="60" height="18" rx="2" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="135" cy="425" r="2.5" fill="#000000"/>
  <rect x="126" y="440" width="60" height="18" rx="2" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="135" cy="449" r="2.5" fill="#000000"/>
  <rect x="126" y="464" width="60" height="18" rx="2" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="135" cy="473" r="2.5" fill="#000000"/>
  <text x="156" y="504" font-size="10" fill="#333333" text-anchor="middle">Level 3</text>

  <rect x="245" y="430" width="190" height="75" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="340" y="462" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Task</text>
  <text x="340" y="482" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Manager</text>

  <rect x="470" y="430" width="190" height="75" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="565" y="462" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">API</text>
  <text x="565" y="482" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Gateway</text>

  <ellipse cx="760" cy="432" rx="42" ry="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <path d="M718,432 L718,494" stroke="#000000" stroke-width="2" fill="none"/>
  <path d="M802,432 L802,494" stroke="#000000" stroke-width="2" fill="none"/>
  <path d="M718,494 A42,12 0 0 0 802,494" stroke="#000000" stroke-width="2" fill="none"/>
  <ellipse cx="760" cy="462" rx="42" ry="12" fill="none" stroke="#000000" stroke-width="1.4"/>
  <text x="760" y="524" font-size="11" fill="#333333" text-anchor="middle">PostgreSQL</text>

  <!-- ==================== Vision / AI Server ==================== -->
  <rect x="910" y="350" width="620" height="220" rx="6" fill="#b0e3e6" stroke="#000000" stroke-width="2"/>
  <text x="930" y="384" font-size="17" font-weight="700" fill="#000000">Vision/AI Server</text>
  <rect x="946" y="428" width="56" height="56" rx="4" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="974" y="464" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">AI</text>
  <line x1="959" y1="428" x2="959" y2="418" stroke="#000000" stroke-width="2"/>
  <line x1="974" y1="428" x2="974" y2="418" stroke="#000000" stroke-width="2"/>
  <line x1="989" y1="428" x2="989" y2="418" stroke="#000000" stroke-width="2"/>
  <line x1="959" y1="484" x2="959" y2="494" stroke="#000000" stroke-width="2"/>
  <line x1="974" y1="484" x2="974" y2="494" stroke="#000000" stroke-width="2"/>
  <line x1="989" y1="484" x2="989" y2="494" stroke="#000000" stroke-width="2"/>
  <line x1="946" y1="443" x2="936" y2="443" stroke="#000000" stroke-width="2"/>
  <line x1="946" y1="469" x2="936" y2="469" stroke="#000000" stroke-width="2"/>
  <line x1="1002" y1="443" x2="1012" y2="443" stroke="#000000" stroke-width="2"/>
  <line x1="1002" y1="469" x2="1012" y2="469" stroke="#000000" stroke-width="2"/>

  <rect x="1065" y="430" width="210" height="75" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="1170" y="462" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">PCB</text>
  <text x="1170" y="482" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Alignment</text>

  <rect x="1300" y="430" width="210" height="75" rx="4" fill="#ffffff" stroke="#999999" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="1405" y="462" font-size="14" font-weight="700" fill="#666666" text-anchor="middle">Defect</text>
  <text x="1405" y="482" font-size="14" font-weight="700" fill="#666666" text-anchor="middle">Inspection</text>

  <!-- ==================== FR5 Arm ==================== -->
  <rect x="90" y="670" width="520" height="245" rx="6" fill="#fff2cc" stroke="#000000" stroke-width="2"/>
  <text x="110" y="704" font-size="17" font-weight="700" fill="#000000">FR5 Arm</text>
  <line x1="152" y1="862" x2="152" y2="806" stroke="#000000" stroke-width="2.5"/>
  <line x1="152" y1="806" x2="188" y2="776" stroke="#000000" stroke-width="2.5"/>
  <line x1="188" y1="776" x2="188" y2="757" stroke="#000000" stroke-width="2.5"/>
  <circle cx="152" cy="806" r="5" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="188" cy="776" r="5" fill="none" stroke="#000000" stroke-width="2"/>
  <line x1="179" y1="753" x2="197" y2="753" stroke="#000000" stroke-width="2.5"/>
  <rect x="128" y="862" width="48" height="11" rx="2" fill="none" stroke="#000000" stroke-width="2"/>

  <rect x="245" y="705" width="340" height="55" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="415" y="738" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Assembly Sequencer</text>
  <line x1="415" y1="762" x2="415" y2="777" stroke="#000000" stroke-width="1.8" marker-end="url(#mk)"/>
  <rect x="245" y="780" width="340" height="55" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="415" y="813" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Motion Planner (MoveIt)</text>
  <line x1="415" y1="837" x2="415" y2="852" stroke="#000000" stroke-width="1.8" marker-end="url(#mk)"/>
  <rect x="245" y="855" width="340" height="55" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="415" y="888" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Gripper Control</text>

  <!-- ==================== Conveyor ==================== -->
  <rect x="650" y="670" width="420" height="245" rx="6" fill="#ffcce6" stroke="#000000" stroke-width="2"/>
  <text x="670" y="704" font-size="17" font-weight="700" fill="#000000">Conveyor</text>
  <rect x="682" y="790" width="76" height="14" rx="3" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="695" cy="817" r="10" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="720" cy="817" r="10" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="745" cy="817" r="10" fill="none" stroke="#000000" stroke-width="2"/>
  <line x1="686" y1="833" x2="754" y2="833" stroke="#000000" stroke-width="2"/>

  <rect x="805" y="740" width="240" height="55" rx="4" fill="#ffffff" stroke="#999999" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="925" y="773" font-size="14" font-weight="700" fill="#666666" text-anchor="middle">Drive Controller</text>
  <rect x="805" y="815" width="240" height="55" rx="4" fill="#ffffff" stroke="#999999" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="925" y="848" font-size="14" font-weight="700" fill="#666666" text-anchor="middle">Position Control</text>

  <!-- ==================== Global Camera ==================== -->
  <rect x="1110" y="670" width="420" height="245" rx="6" fill="#d5e8d4" stroke="#000000" stroke-width="2"/>
  <text x="1130" y="704" font-size="17" font-weight="700" fill="#000000">Global Camera</text>
  <rect x="1148" y="806" width="58" height="38" rx="4" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="1177" cy="825" r="11" fill="none" stroke="#000000" stroke-width="2"/>
  <rect x="1161" y="797" width="20" height="9" rx="2" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="1177" y="866" font-size="10" fill="#333333" text-anchor="middle">Intel D435</text>

  <rect x="1265" y="780" width="240" height="55" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="1385" y="813" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">Video Streamer</text>

  <!-- ==================== ARROWS ==================== -->

  <!-- Run Control -> API Gateway (HTTP) -->
  <line x1="605" y1="207" x2="605" y2="426" stroke="#00a352" stroke-width="2.6" marker-end="url(#mg)"/>

  <!-- API Gateway -> Monitor (HTTP) -->
  <polyline points="490,428 490,300 355,300 355,209" fill="none" stroke="#00a352" stroke-width="2.6" marker-end="url(#mg)"/>

  <!-- Task Manager <-> API Gateway -->
  <line x1="437" y1="467" x2="468" y2="467" stroke="#000000" stroke-width="2" marker-start="url(#mk)" marker-end="url(#mk)"/>

  <!-- API Gateway <-> DB -->
  <line x1="662" y1="467" x2="716" y2="467" stroke="#000000" stroke-width="2" marker-start="url(#mk)" marker-end="url(#mk)"/>

  <!-- API Gateway <-> Assembly Sequencer (ROS2) -->
  <line x1="520" y1="507" x2="520" y2="703" stroke="#1a73e8" stroke-width="2.6" marker-start="url(#mb)" marker-end="url(#mb)"/>

  <!-- API Gateway -> Drive Controller (ROS2, 미구현) -->
  <polyline points="630,507 630,615 925,615 925,738" fill="none" stroke="#1a73e8" stroke-width="2.6" stroke-dasharray="7 4" marker-end="url(#mb)"/>

  <!-- PCB Alignment -> Assembly Sequencer (ROS2) -->
  <polyline points="1100,507 1100,650 400,650 400,703" fill="none" stroke="#1a73e8" stroke-width="2.6" marker-end="url(#mb)"/>

  <!-- Video Streamer -> PCB Alignment -->
  <polyline points="1300,778 1300,630 1170,630 1170,507" fill="none" stroke="#9933cc" stroke-width="2.6" marker-end="url(#mp)"/>

  <!-- PCB Alignment -> Monitor (HUD 영상) -->
  <polyline points="1220,428 1220,320 410,320 410,209" fill="none" stroke="#9933cc" stroke-width="2.6" marker-end="url(#mp)"/>

  <!-- Assembly Sequencer -> Monitor (텔레메트리) -->
  <polyline points="243,732 60,732 60,52 300,52 300,131" fill="none" stroke="#1a73e8" stroke-width="2.6" marker-end="url(#mb)"/>

  <!-- footer -->
  <text x="90" y="950" font-size="11.5" fill="#555555">지시는 Main Server를 거치고, 관절 상태·영상 스트림은 GUI/DT로 직접 간다. 조립 스텝 실행은 FR5 Arm이, 작업 접수·승인·기록은 Main Server가 소유한다.</text>

</svg>
