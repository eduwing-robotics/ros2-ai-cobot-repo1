<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M1,1 L10,6 L1,11 Z" fill="#64748B"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK KR", "Noto Sans KR", sans-serif; fill: #0F172A; }
      .title { font-size: 42px; font-weight: 800; letter-spacing: -0.8px; }
      .subtitle { font-size: 20px; font-weight: 500; fill: #64748B; }
      .card-title { font-size: 30px; font-weight: 800; fill: #FFFFFF; }
      .card-subtitle { font-size: 15px; font-weight: 600; fill: #FFFFFF; opacity: 0.82; letter-spacing: 1.2px; }
      .item { font-size: 23px; font-weight: 600; }
      .main-item { font-size: 25px; font-weight: 650; }
      .edge-label { font-size: 17px; font-weight: 700; fill: #475569; }
      .footer { font-size: 17px; font-weight: 500; fill: #64748B; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#F8FAFC"/>
  <text x="960" y="64" text-anchor="middle" class="title">KSMC 소프트웨어 아키텍처</text>
  <text x="960" y="104" text-anchor="middle" class="subtitle">Main Server 중심의 5개 핵심 서브시스템</text>

  <!-- Connections: only four direct links, drawn behind cards -->
  <g fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <path d="M510 315 L680 410"/>
    <path d="M1410 315 L1240 410"/>
    <path d="M510 795 L680 670"/>
    <path d="M1410 795 L1240 670"/>
  </g>

  <!-- Link labels -->
  <g>
    <rect x="523" y="339" width="144" height="42" rx="21" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="595" y="367" text-anchor="middle" class="edge-label">명령 · 상태</text>

    <rect x="1251" y="339" width="158" height="42" rx="21" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="1330" y="367" text-anchor="middle" class="edge-label">Job · Pose · 검사</text>

    <rect x="523" y="719" width="144" height="42" rx="21" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="595" y="747" text-anchor="middle" class="edge-label">명령 · 상태</text>

    <rect x="1258" y="719" width="144" height="42" rx="21" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="1330" y="747" text-anchor="middle" class="edge-label">이송 · 상태</text>
  </g>

  <!-- GUI / DT -->
  <g filter="url(#shadow)">
    <rect x="60" y="140" width="450" height="350" rx="28" fill="#FFFFFF"/>
    <path d="M88 140 H482 Q510 140 510 168 V230 H60 V168 Q60 140 88 140 Z" fill="#6366F1"/>
  </g>
  <text x="92" y="184" class="card-title">GUI / DT</text>
  <text x="92" y="214" class="card-subtitle">OPERATOR &amp; DIGITAL TWIN</text>
  <g class="item">
    <circle cx="94" cy="270" r="6" fill="#6366F1"/><text x="116" y="278">Unity 3D Digital Twin</text>
    <circle cx="94" cy="318" r="6" fill="#6366F1"/><text x="116" y="326">공정 대시보드</text>
    <circle cx="94" cy="366" r="6" fill="#6366F1"/><text x="116" y="374">Start / Stop / Reset</text>
    <circle cx="94" cy="414" r="6" fill="#6366F1"/><text x="116" y="422">로봇·컨베이어 상태</text>
    <circle cx="94" cy="462" r="6" fill="#6366F1"/><text x="116" y="470">PASS / FAIL · 이력</text>
  </g>

  <!-- Main Server -->
  <g filter="url(#shadow)">
    <rect x="680" y="290" width="560" height="500" rx="32" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
    <path d="M712 290 H1208 Q1240 290 1240 322 V395 H680 V322 Q680 290 712 290 Z" fill="#2563EB"/>
  </g>
  <text x="960" y="340" text-anchor="middle" class="card-title" style="font-size:36px">Main Server</text>
  <text x="960" y="374" text-anchor="middle" class="card-subtitle">ROS 2 CELL CONTROL HUB</text>
  <g class="main-item">
    <circle cx="734" cy="445" r="7" fill="#2563EB"/><text x="760" y="454">ROS 2 Jazzy / DDS</text>
    <circle cx="734" cy="501" r="7" fill="#2563EB"/><text x="760" y="510">Cell Orchestrator</text>
    <circle cx="734" cy="557" r="7" fill="#2563EB"/><text x="760" y="566">공정 State Machine</text>
    <circle cx="734" cy="613" r="7" fill="#2563EB"/><text x="760" y="622">Safety Interlock / Watchdog</text>
    <circle cx="734" cy="669" r="7" fill="#2563EB"/><text x="760" y="678">TF / World Model</text>
    <circle cx="734" cy="725" r="7" fill="#2563EB"/><text x="760" y="734">Recipe · Job · Log Manager</text>
  </g>

  <!-- AI Server / Vision -->
  <g filter="url(#shadow)">
    <rect x="1410" y="140" width="450" height="350" rx="28" fill="#FFFFFF"/>
    <path d="M1438 140 H1832 Q1860 140 1860 168 V230 H1410 V168 Q1410 140 1438 140 Z" fill="#8B5CF6"/>
  </g>
  <text x="1442" y="184" class="card-title">AI Server / Vision</text>
  <text x="1442" y="214" class="card-subtitle">PERCEPTION &amp; QUALITY</text>
  <g class="item">
    <circle cx="1444" cy="270" r="6" fill="#8B5CF6"/><text x="1466" y="278">D435 · S22 · GoPro 입력</text>
    <circle cx="1444" cy="318" r="6" fill="#8B5CF6"/><text x="1466" y="326">기판 / 부품 검출</text>
    <circle cx="1444" cy="366" r="6" fill="#8B5CF6"/><text x="1466" y="374">RGB-D Depth · Pose</text>
    <circle cx="1444" cy="414" r="6" fill="#8B5CF6"/><text x="1466" y="422">Hand-Eye / Eye-to-Hand</text>
    <circle cx="1444" cy="462" r="6" fill="#8B5CF6"/><text x="1466" y="470">조립 검사 · 결과 발행</text>
  </g>

  <!-- FR5 -->
  <g filter="url(#shadow)">
    <rect x="60" y="620" width="450" height="350" rx="28" fill="#FFFFFF"/>
    <path d="M88 620 H482 Q510 620 510 648 V710 H60 V648 Q60 620 88 620 Z" fill="#16A34A"/>
  </g>
  <text x="92" y="664" class="card-title">FR5</text>
  <text x="92" y="694" class="card-subtitle">ROBOT &amp; GRIPPER CONTROL</text>
  <g class="item">
    <circle cx="94" cy="750" r="6" fill="#16A34A"/><text x="116" y="758">FAIRINO Command Server</text>
    <circle cx="94" cy="798" r="6" fill="#16A34A"/><text x="116" y="806">Motion / Gripper Executor</text>
    <circle cx="94" cy="846" r="6" fill="#16A34A"/><text x="116" y="854">MoveJ / MoveL / MoveCart</text>
    <circle cx="94" cy="894" r="6" fill="#16A34A"/><text x="116" y="902">toolcoord1 / TCP</text>
    <circle cx="94" cy="942" r="6" fill="#16A34A"/><text x="116" y="950">/nonrt_state_data</text>
  </g>

  <!-- Conveyor -->
  <g filter="url(#shadow)">
    <rect x="1410" y="620" width="450" height="350" rx="28" fill="#FFFFFF"/>
    <path d="M1438 620 H1832 Q1860 620 1860 648 V710 H1410 V648 Q1410 620 1438 620 Z" fill="#EA580C"/>
  </g>
  <text x="1442" y="664" class="card-title">Conveyor</text>
  <text x="1442" y="694" class="card-subtitle">TURTLEBOT-BASED TRANSFER</text>
  <g class="item">
    <circle cx="1444" cy="750" r="6" fill="#EA580C"/><text x="1466" y="758">TurtleBot ROS Driver</text>
    <circle cx="1444" cy="798" r="6" fill="#EA580C"/><text x="1466" y="806">Conveyor Controller</text>
    <circle cx="1444" cy="846" r="6" fill="#EA580C"/><text x="1466" y="854">/cmd_vel</text>
    <circle cx="1444" cy="894" r="6" fill="#EA580C"/><text x="1466" y="902">/joint_states · /odom</text>
    <circle cx="1444" cy="942" r="6" fill="#EA580C"/><text x="1466" y="950">PRESTOP / ALIGN / HOLD</text>
  </g>

  <text x="960" y="1044" text-anchor="middle" class="footer">※ 5개 블록은 논리 구성 단위이며, 필요하면 한 대의 PC에서 통합 실행할 수 있음</text>
</svg>
