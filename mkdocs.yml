site_name: HBM 조립체 디지털 트윈
site_description: HBM 조립체 디지털 트윈 프로젝트 개요

docs_dir: docs
site_dir: /tmp/main-unity-mkdocs-site

nav:
  - 프로젝트 개요: index.md

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 시스템 테마 사용
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 어두운 테마로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 밝은 테마로 전환
  features:
    - navigation.top

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
