yolo:
  model_path: /home/hc/KSMC/vision_assembly/obb/runs/parts_obb_6class/weights/best.pt
  # Small package parts disappear when the 1920x1080 frame is reduced to 640.
  # Match the resolution used for validation and keep a low preview threshold.
  image_size: 960
  confidence: 0.08
  iou: 0.30
  obb_duplicate_iou: 0.25
  # RTX GPU: FP16 reduces inference latency without changing the 960 px input.
  device: '0'
  half: true
  max_detections: 100
  camera_timeout_sec: 2.0
  output_topic: /vision/parts_obb/detections
  status_topic: /vision/parts_obb/status
  annotated_topic: /vision/parts_obb/image/compressed
  # Detection still uses the full source. Only the viewer stream is resized.
  jpeg_quality: 72
  annotated_max_width: 1280
  draw_angle: false
  draw_object_ids: false
  draw_object_centers: true
  # Viewer-only temporal smoothing. Published detections remain current-frame
  # values so robot logic never consumes a held/stale visual track.
  display_stabilization:
    enabled: true
    smoothing_alpha: 0.25
    match_distance_px: 32
    hold_frames: 2
    class_hold_frames:
      inductor: 4
      smd_capacitor: 4
  tray_roi_filter:
    enabled: true
    layout_file: /home/hc/KSMC/vision_assembly/config/tray_layout.json
    # The D435 tray-view pose is fixed. Reuse the manually validated boxes
    # exactly instead of estimating or shifting them from image features.
    registration_mode: fixed
    registration_scale: 0.35
    registration_interval_sec: 1.5
    registration_timeout_sec: 3.5
    smoothing_frames: 5
    ratio_test: 0.72
    min_matches: 14
    min_inliers: 10
    ransac_px: 4.0
    min_scale_area: 0.18
    max_scale_area: 3.0
    classes:
      gpu:
        bin_id: gpu_bin
        min_score: 0.50
        min_area_norm: 0.0048
        max_area_norm: 0.0140
        max_count: 2
      hbm:
        bin_id: hbm_bin
        min_score: 0.15
        min_area_norm: 0.00035
        max_area_norm: 0.00120
        max_count: 16
      power_module:
        bin_id: long_orange_bin
        min_score: 0.20
        min_area_norm: 0.00180
        max_area_norm: 0.00480
        max_count: 8
      vrm:
        bin_id: black_block_bin
        min_score: 0.28
        min_area_norm: 0.00035
        max_area_norm: 0.00110
        max_count: 10
      inductor:
        bin_id: marked_white_bin
        min_score: 0.10
        min_area_norm: 0.00020
        max_area_norm: 0.00070
        max_count: 4
      smd_capacitor:
        bin_id: right_white_brown_bin
        min_score: 0.10
        min_area_norm: 0.00004
        max_area_norm: 0.00025
        max_count: 10
